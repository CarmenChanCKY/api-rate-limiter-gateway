# Standalone reverse proxy for rate-limiter.ckying.com.
# Cert files live in ./nginx/certs/ (NOT committed, see DEPLOY.md Q13):
#   ssl.crt  (+ ssl.key)                       - origin certificate
#   authenticated_origin_pull_ca.pem          - Cloudflare origin pull CA (optional)

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # Trust Cloudflare edge IPs so $remote_addr is the real visitor IP.
    # (Cloudflare edge ranges; refresh from cloudflare.com/ips if needed.)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 199.27.128.0/21;
    set_real_ip_from 8.25.192.0/22;
    set_real_ip_from 8.28.16.0/22;
    set_real_ip_from 8.34.208.0/20;
    set_real_ip_from 8.35.208.0/20;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # 20 req/s + burst 30.
    # This is nginx-level protection; the Redis token bucket still applies per API key.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 443 ssl;
        server_name rate-limiter.ckying.com;

        ssl_certificate /etc/nginx/certs/ssl.crt;
        ssl_certificate_key /etc/nginx/certs/ssl.key;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        # Cloudflare Authenticated Origin Pull.
        # Comment out if the new cert is NOT a Cloudflare origin cert.
        ssl_client_certificate /etc/nginx/certs/authenticated_origin_pull_ca.pem;
        ssl_verify_client on;

        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://gateway:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Gateway auth + per-IP mint limit depend on these two.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        }
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name rate-limiter.ckying.com;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        return 301 https://$host$request_uri;
    }
}
